# Allow local development without exposing the app through arbitrary host names.
play.filters.hosts.allowed = ["localhost", "127.0.0.1", "[::1]"]
play.i18n.langs = ["en"]

# The client reads these at startup and reports missing values on a search.
# Never store an actual token here.
mastodon.instance = ${?MASTODON_INSTANCE}
mastodon.accessToken = ${?MASTODON_ACCESS_TOKEN}
